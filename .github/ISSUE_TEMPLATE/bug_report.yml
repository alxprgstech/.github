name: Сообщить об ошибке
description: Опишите воспроизводимую проблему в этом проекте.
title: "[Ошибка]: "
body:
  - type: markdown
    attributes:
      value: |
        Перед отправкой проверьте существующие задачи и укажите проект, в котором возникла проблема.
        Не публикуйте здесь сведения об уязвимостях. Следуйте политике безопасности проекта или напишите конфиденциально на alxprgs@gmail.com.
        Удалите пароли, токены, ключи, файлы cookie, персональные данные и другую конфиденциальную информацию из текста и вложений.
  - type: textarea
    id: summary
    attributes:
      label: Описание проблемы
      description: Объясните, что работает неправильно и как это влияет на вас.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия или коммит, в котором возникла проблема
      description: Укажите версию релиза или полный SHA коммита проблемной сборки, а не только название ветки или «latest».
      placeholder: "Версия из VERSION или SHA коммита проблемной сборки"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Шаги для воспроизведения
      description: Перечислите шаги по порядку и, если полезно, добавьте минимальный пример без конфиденциальных данных. Укажите необходимые условия.
      placeholder: |
        1. Откройте или запустите...
        2. Выполните...
        3. Проверьте результат...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
      description: Что должно произойти?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Что происходит вместо этого? Укажите видимую ошибку и частоту её появления.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Логи без конфиденциальных данных
      description: Вставьте нужный фрагмент логов после удаления конфиденциальных данных либо приложите очищенный файл и опишите его. Если логи не создаются или недоступны, объясните почему. Не прикладывайте дампы конфигурации и секреты.
      placeholder: "Нужные логи после удаления конфиденциальных данных или объяснение, почему они недоступны."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Окружение (необязательно)
      description: Подходящие к проблеме сведения об операционной системе, браузере, среде выполнения, способе развёртывания или конфигурации. Указывайте только неконфиденциальную информацию.
    validations:
      required: false
