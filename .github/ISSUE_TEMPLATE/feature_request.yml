name: Предложить улучшение
description: Предложите полезное изменение, обозначив проблему и ожидаемую пользу.
title: "[Улучшение]: "
body:
  - type: markdown
    attributes:
      value: |
        Сначала проверьте существующие задачи. Объясните пользу изменения: предложения ради самих изменений вряд ли будут приняты.
        Крупные изменения, новые зависимости и изменения архитектуры следует обсудить до реализации.
        Не добавляйте секреты и персональные данные. Сообщайте об уязвимостях конфиденциально — через политику безопасности проекта или на alxprgs@gmail.com.
  - type: textarea
    id: problem
    attributes:
      label: Проблема или сценарий использования
      description: Опишите задачу, которую не удаётся выполнить, или недостаток текущего поведения. Объясните, почему существующих возможностей недостаточно.
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: Ожидаемая польза
      description: Кому поможет это изменение и какой полезный результат оно обеспечит?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое решение (необязательно)
      description: Если у вас есть идея, опишите предлагаемое поведение и границы изменения. Проектировать реализацию не нужно.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Рассмотренные альтернативы (необязательно)
      description: Опишите существующие обходные пути или другие подходы и их ограничения.
    validations:
      required: false
