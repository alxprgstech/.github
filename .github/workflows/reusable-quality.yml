name: Повторно используемые проверки качества

on:
  workflow_call:
    inputs:
      install-command:
        description: Явная команда настройки проекта, включая установку зависимостей по lock-файлу.
        required: true
        type: string
      quality-command:
        description: Команда проекта, запускающая все применимые обязательные проверки и возвращающая ненулевой код при ошибке.
        required: true
        type: string
      python-version:
        description: Явно укажите версию Python; оставьте пустым, если Python не требуется.
        required: false
        type: string
        default: ''
      node-version:
        description: Явно укажите версию Node.js; оставьте пустым, если Node.js не требуется.
        required: false
        type: string
        default: ''
      timeout-minutes:
        description: Общее время ожидания задания — от 1 до 60 минут.
        required: false
        type: number
        default: 20

permissions:
  contents: read

jobs:
  quality:
    name: Проверки качества проекта
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      SENTRY_ENABLED: 'false'
      SENTRY_FRONTEND_ENABLED: 'false'
      SENTRY_REPLAY_ENABLED: 'false'
    defaults:
      run:
        shell: bash
    steps:
      - name: Проверить конфигурацию
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
          QUALITY_COMMAND: ${{ inputs.quality-command }}
          TIMEOUT: ${{ inputs.timeout-minutes }}
        run: |
          [[ "$INSTALL_COMMAND" =~ [^[:space:]] ]] || { echo '::error::Параметр install-command не должен быть пустым'; exit 1; }
          [[ "$QUALITY_COMMAND" =~ [^[:space:]] ]] || { echo '::error::Параметр quality-command не должен быть пустым'; exit 1; }
          [[ "$TIMEOUT" =~ ^[0-9]+$ ]] && (( TIMEOUT >= 1 && TIMEOUT <= 60 )) || { echo '::error::Параметр timeout-minutes должен быть целым числом от 1 до 60'; exit 1; }
      - name: Получить ревизию вызывающего проекта
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Записать проверяемую ревизию
        run: |
          printf '### Проверки качества\n\nКоммит-источник: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Настроить Python
        if: inputs.python-version != ''
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ inputs.python-version }}
      - name: Настроить Node.js
        if: inputs.node-version != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - name: Установить зависимости проекта
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash --noprofile --norc -e -o pipefail -c "$INSTALL_COMMAND"
      - name: Выполнить проверки качества проекта
        env:
          QUALITY_COMMAND: ${{ inputs.quality-command }}
        run: bash --noprofile --norc -e -o pipefail -c "$QUALITY_COMMAND"
      - name: Итог проверки
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          printf '\nРезультат задания: **%s**. Подробности об ошибках и пропущенных шагах смотрите в списке шагов.\n' "$RESULT" >> "$GITHUB_STEP_SUMMARY"
          printf 'Выполнены только настроенные команды проекта; сам этот workflow не подтверждает соответствие стандартам.\n' >> "$GITHUB_STEP_SUMMARY"
